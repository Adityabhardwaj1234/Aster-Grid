[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "astergrid"
version = "0.1.0"
description = "ASTERGRID — 3D scenario intelligence and multi-agent command lab"
readme = { text = "ASTERGRID backend: deterministic scenario simulation, typed verification workflow, and the FastAPI/SSE command-center API.", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aditya Bhardwaj" }]
dependencies = [
    "google-adk==2.12.0",
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "numpy>=2.5,<3",
    "networkx>=3.7,<4",
    "aiosqlite>=0.22,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<1",
    "ruff>=0.17,<1",
]

[project.scripts]
astergrid = "astergrid.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/astergrid"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
