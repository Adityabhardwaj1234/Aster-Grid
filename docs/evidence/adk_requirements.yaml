project_name: astergrid
business_objective: 'Design a Google ADK 2.12 graph_workflow, not a live voice agent.
  Use a Workflow with FunctionNode and JoinNode. No audio, video, BigQuery, or code
  execution tools are required. Build ASTERGRID: a local FastAPI backend and React
  TypeScript Three.js frontend. The workflow validates a synthetic scenario, builds
  a seeded world, runs conditions, resource allocation, and accessibility analysis
  concurrently, joins outputs, performs preflight verification, runs a deterministic
  simulation, performs outcome verification, applies at most two bounded revisions,
  and produces a reproducible report. Roles: Scenario Director, Intake, World Builder,
  Conditions, Resources, Accessibility, Simulation, Critic, Reporter. Deterministic
  policy mode must work without any model API key; optional Gemini mode is key-gated.
  Persist with SQLite, stream ordered events over SSE, validate all artifacts with
  Pydantic. Fictional emergency coordination only; no military targeting or real-world
  operational use.'
